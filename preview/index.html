<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>廢塔一夜 — 單人一夜 TRPG</title>
<!--
  Solo one-shot TRPG. Static files only: this page plus data/ and js/.
  No build step, no framework, no CDN, no network calls, no external assets.
  Works over http(s) and by double-clicking the file (file://).
  Player-facing text: Traditional Chinese (Hong Kong). Code/comments: English.
  Story script lives in data/wasted_tower.js — writers edit that, not the engine.
-->
<style>
:root{
  --bg:#0d0f13; --panel:#161a21; --panel2:#1d222b; --line:#2a3140;
  --ink:#e8eaee; --muted:#98a1af; --accent:#e3b04b; --roll:#9ec5ff;
  --good:#7fc98a; --bad:#e8756b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans CJK HK","Noto Sans HK","PingFang HK","PingFang TC",
              "Hiragino Sans CNS","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;
}
#app{min-height:100%}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:16px 16px 40px}

/* ---------- opening screen ---------- */
.hero{padding:30px 8px 4px;text-align:center}
.hero h1{margin:0 0 8px;font-size:36px;letter-spacing:.08em;color:var(--accent)}
.hero .sub{margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.14em}
.hero .lead{margin:16px auto 0;max-width:640px;color:#c9d1dd;font-size:15px}
.sectitle{margin:28px 0 10px;font-size:14px;letter-spacing:.16em;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
.card h2{margin:0;font-size:23px;letter-spacing:.04em}
.card .tag{color:var(--accent);font-size:13px;letter-spacing:.1em;margin-top:-6px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.kv{font-size:14px;color:var(--muted);margin:0}
.kv b{color:var(--ink);font-weight:600}
.card .btn{margin-top:4px}

/* ---------- buttons ---------- */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font:inherit;font-size:15px;line-height:1.45;padding:10px 14px;border-radius:10px;
  cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:#28303c;border-color:#3d4a5c}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#20180a;border-color:var(--accent);font-weight:700;text-align:center}
.btn.primary:hover:not(:disabled){background:#f2c467}
.btn.ghost{background:transparent}
.btn small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.btn.primary small{color:#4a3a12}

/* ---------- play screen ---------- */
.play{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:960px;margin:0 auto;width:100%}
.status{flex:0 0 auto;background:#12161c;border-bottom:1px solid var(--line);
  padding:9px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.status .who{font-weight:700;font-size:15px}
.status .who span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.hpwrap{display:flex;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.hpwrap .lab{color:var(--muted);font-size:12.5px;letter-spacing:.1em}
.hpbar{width:104px;height:9px;border-radius:6px;background:#232a34;border:1px solid var(--line);overflow:hidden}
.hpfill{height:100%;background:var(--good);transition:width .2s}
.hpfill.warn{background:var(--accent)}
.hpfill.low{background:var(--bad)}
.inv{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inv .lab{color:var(--muted);font-size:12.5px;letter-spacing:.1em}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:12.5px;color:#c3ccd9}
.chip.none{border-style:dashed;color:var(--muted)}

#log{flex:1 1 auto;overflow-y:auto;padding:18px 16px 26px;-webkit-overflow-scrolling:touch}
.line{margin:0 0 8px;max-width:72ch}
.line.fact{color:var(--ink)}
.line.narr{color:#c6cedb}
.line.roll{color:var(--roll);font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.line.act{color:var(--accent);font-size:14.5px}
.line.sys{color:var(--muted);font-size:13.5px}
.line.good{color:var(--good)}
.line.bad{color:var(--bad)}
.divider{border:0;border-top:1px dashed var(--line);margin:18px 0 14px}
.banner{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.banner.win{border-color:#3f6a46;background:#16211a}
.banner.secret{border-color:#6a5a36;background:#211c15}
.banner.lose{border-color:#6a3b36;background:#211615}
.banner h2{margin:0 0 4px;font-size:20px;letter-spacing:.1em}
.banner.win h2{color:var(--good)}
.banner.secret h2{color:#e0c56a}
.banner.lose h2{color:var(--bad)}
.banner p{margin:0;color:var(--muted);font-size:14px}

#actions{flex:0 0 auto;border-top:1px solid var(--line);background:#12161c;
  padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow-y:auto}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row > .btn{flex:1 1 240px}
.tray{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tray h3{margin:0 0 2px;font-size:12.5px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0}

/* ---------- fatal validator screen ---------- */
.fatal{max-width:760px;margin:60px auto;padding:22px;background:var(--panel);border:1px solid #6a3b36;border-radius:14px}
.fatal h1{margin:0 0 10px;font-size:22px;color:var(--bad)}
.fatal p{color:var(--muted);font-size:14px}
.fatal ul{margin:12px 0 0;padding-left:20px}
.fatal li{margin:4px 0;color:#f0c9c4;font-size:14px;word-break:break-word}

.foes{display:flex;flex-direction:column;gap:8px}
.foe{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.foe-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.foe-name{font-weight:700}
.foe-hp{color:var(--muted);font-size:14px}
.badge{border:1px solid transparent;border-radius:999px;padding:0 8px;font-size:13px;line-height:1.7;cursor:pointer;background:#2a2418;color:var(--accent)}
.badge.prone{background:#1a2433;color:var(--roll);border-color:#3d5270}
.badge.restrained{background:#2a2418;color:var(--accent);border-color:#6a5428}
.badge-note{margin:6px 0 0;color:#d5dbe6;font-size:14px}
.combat-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.combat-menu > .btn{min-height:56px;font-size:18px;text-align:center;padding:14px 10px}
.combat-menu > .btn.span{grid-column:1 / -1}
.move-group{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
.move-group + .move-group{margin-top:8px}
.move-toggle{width:100%;min-height:52px;font-size:18px;font-weight:700;text-align:left;border:0;border-radius:0;background:transparent}
.move-list{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.move-list > .btn.move{min-height:64px;padding:12px 14px;font-size:17px;line-height:1.35}
.move-list > .btn.move small{display:block;margin-top:2px}
.move-list > .btn.move .uses{color:var(--accent);font-size:13px}
.move-list > .btn.move.spent{opacity:.45}
.credits{max-width:720px;margin:28px auto;padding:8px 8px 40px}
.credits h1{margin:0 0 12px;font-size:28px;letter-spacing:.08em;color:var(--accent)}
.credits p{margin:0 0 14px}
.credits .attrib{font-size:14px;line-height:1.6;color:#c9d1dd;word-break:break-word}

@media (max-width:640px){
  .hero h1{font-size:28px}
  .wrap{padding:12px 12px 32px}
  .cards{grid-template-columns:1fr}
  .row > .btn{flex:1 1 100%}
  .line{max-width:none}
  .status{gap:4px 12px;padding:8px 12px}
  .hpbar{width:80px}
  #log{padding:14px 12px 20px}
  .combat-menu > .btn{min-height:58px;font-size:18px}
  #actions{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
}

.banner.rest{border-color:#3d4e62;background:#151b24}
.banner.rest h2{color:var(--accent)}
.save-card{margin-top:18px}
.save-card .row{margin-top:4px}
textarea.code{
  width:100%;min-height:88px;resize:vertical;display:block;
  background:#0d0f13;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font:inherit;font-size:16px;line-height:1.45;
}
.save-note{color:var(--muted);font-size:13px;margin:8px 0 0}
.save-error{color:var(--bad);font-size:13.5px;margin:8px 0 0}
.ending-card{margin:14px 0;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ending-img{width:100%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--line);background:#141820}
.ending-cap{color:var(--muted);font-size:13px}

/* ---------- dice playback (presentational only) ---------- */
.dice-overlay{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;
  padding:24px 12px calc(24px + env(safe-area-inset-bottom));
  background:rgba(8,10,14,.78);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.dice-row{display:flex;align-items:center;justify-content:center;gap:12px;max-width:100%}
.d20{
  position:relative;width:46vw;height:46vw;max-width:180px;max-height:180px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.dice-row.multi .d20{width:34vw;height:34vw;max-width:148px;max-height:148px}
.d20 .shape{width:100%;height:100%;display:block;transform-origin:50% 46%}
.d20 .outer{fill:#1a2030;stroke:#9ec5ff;stroke-width:3;stroke-linejoin:round}
.d20 .edge{fill:rgba(158,197,255,.07);stroke:#7f9cc4;stroke-width:1.5;stroke-linejoin:round}
.d20 .face{
  position:absolute;z-index:1;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink);
  font-size:clamp(32px,11vw,52px);pointer-events:none;
}
.d20.settled{transform:scale(1.08)}
.d20.settled .face{font-size:clamp(48px,16vw,78px);color:var(--accent)}
.dice-row.multi .d20 .face{font-size:clamp(26px,9vw,42px)}
.dice-row.multi .d20.settled .face{font-size:clamp(36px,12vw,60px)}
.d20.spinning .shape{animation:d20-spin .2s linear infinite}
.d20.kept .outer,.d20.kept .edge{stroke:var(--accent)}
.d20.kept{filter:drop-shadow(0 0 12px rgba(227,176,75,.65))}
.dice-row.multi .d20.settled:not(.kept){opacity:.5;filter:none}
@keyframes d20-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .d20.spinning .shape{animation:none}
  .d20.settled{transform:none}
}
@media (max-width:640px){
  .dice-overlay{padding:16px 8px calc(16px + env(safe-area-inset-bottom))}
  .dice-row{gap:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="credits-src">
  <h1>授權與鳴謝</h1>
  <p>《廢塔一夜》部分戰鬥規則（例如優勢、劣勢、狀態、豁免、傷害類型，以及部分招式、道具與敵人能力）改編自下列規則文件，並經刪減、調整數值與翻譯為中文。</p>

<script src="data/wasted_tower.js"></script>
<script src="js/engine.js"></script>
<script src="js/narrator.js"></script>
<script src="js/dice.js"></script>

</body>
